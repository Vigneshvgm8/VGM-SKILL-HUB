<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none">
    <rect width="600" height="340" rx="20" fill="#0B131E"/>
    <!-- Glow -->
    <circle cx="480" cy="80" r="140" fill="#43C170" fill-opacity="0.15" filter="blur(40px)"/>
    <circle cx="120" cy="260" r="120" fill="#02569B" fill-opacity="0.2" filter="blur(40px)"/>
    <!-- Phone Mockup Frame -->
    <rect x="360" y="40" width="180" height="260" rx="24" fill="#141E2B" stroke="#43C170" stroke-width="2.5"/>
    <rect x="380" y="60" width="140" height="220" rx="14" fill="#0A0F17"/>
    <!-- Phone Screen Elements -->
    <rect x="395" y="80" width="110" height="18" rx="5" fill="#1E293B"/>
    <rect x="395" y="106" width="70" height="10" rx="3" fill="#43C170" fill-opacity="0.6"/>
    <!-- Chat bubbles inside phone -->
    <rect x="395" y="128" width="90" height="28" rx="8" fill="#1E7A46" fill-opacity="0.4"/>
    <rect x="420" y="164" width="85" height="36" rx="8" fill="#0284C7" fill-opacity="0.3"/>
    <circle cx="450" cy="245" r="14" fill="#43C170"/>
    <path d="M445 245l4 4 8-8" stroke="#0B131E" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Left Typography & Badges -->
    <rect x="40" y="45" width="130" height="26" rx="6" fill="#43C170" fill-opacity="0.15" stroke="#43C170" stroke-width="1.2"/>
    <text x="50" y="62" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#43C170">FLAGSHIP INTERNSHIP</text>
    
    <text x="40" y="115" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF">AI-Powered</text>
    <text x="40" y="150" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#43C170">Mobile App Dev</text>
    
    <text x="40" y="185" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Flutter · React Native · Gemini LLMs · Firebase</text>
    
    <!-- Pills -->
    <g transform="translate(40, 220)">
      <rect width="80" height="26" rx="6" fill="#1E293B"/>
      <text x="12" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38BDF8">iOS &amp; Android</text>
      
      <rect x="90" width="85" height="26" rx="6" fill="#1E293B"/>
      <text x="100" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FACC15">Play Store</text>

      <rect x="185" width="95" height="26" rx="6" fill="#1E293B"/>
      <text x="195" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#4ADE80">Live Project</text>
    </g>
  </svg>