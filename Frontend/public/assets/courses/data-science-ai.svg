<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none">
    <rect width="600" height="340" rx="20" fill="#0B131E"/>
    <circle cx="480" cy="120" r="140" fill="#F59E0B" fill-opacity="0.15" filter="blur(40px)"/>
    <circle cx="160" cy="240" r="120" fill="#8B5CF6" fill-opacity="0.15" filter="blur(40px)"/>
    
    <!-- Graph & Nodes Graphic -->
    <rect x="330" y="50" width="230" height="240" rx="14" fill="#111827" stroke="#334155" stroke-width="2"/>
    <!-- Bar chart inside -->
    <rect x="355" y="210" width="22" height="50" rx="4" fill="#8B5CF6"/>
    <rect x="385" y="180" width="22" height="80" rx="4" fill="#EC4899"/>
    <rect x="415" y="140" width="22" height="120" rx="4" fill="#F59E0B"/>
    <rect x="445" y="110" width="22" height="150" rx="4" fill="#10B981"/>
    <rect x="475" y="80" width="22" height="180" rx="4" fill="#3B82F6"/>
    <rect x="505" y="130" width="22" height="130" rx="4" fill="#6366F1"/>
    
    <!-- Neural Nodes -->
    <circle cx="390" cy="90" r="6" fill="#F59E0B"/>
    <circle cx="470" cy="70" r="6" fill="#10B981"/>
    <line x1="390" y1="90" x2="470" y2="70" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3 3"/>
    
    <!-- Left text -->
    <rect x="40" y="45" width="135" height="26" rx="6" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="50" y="62" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#FBBF24">GENERATIVE AI CORE</text>
    
    <text x="40" y="115" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF">Data Science &amp;</text>
    <text x="40" y="150" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#FBBF24">Agentic AI Mastery</text>
    <text x="40" y="185" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Python · PyTorch · Scikit · LangChain · Pandas</text>
    
    <g transform="translate(40, 220)">
      <rect width="70" height="26" rx="6" fill="#1E293B"/>
      <text x="12" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FBBF24">Python</text>
      
      <rect x="80" width="85" height="26" rx="6" fill="#1E293B"/>
      <text x="90" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#A78BFA">PyTorch</text>

      <rect x="175" width="95" height="26" rx="6" fill="#1E293B"/>
      <text x="185" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34D399">Agentic AI</text>
    </g>
  </svg>