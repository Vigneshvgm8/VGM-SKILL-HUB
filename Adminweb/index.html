<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Automatically normalize subfolder URL on Hostinger / Apache if loaded without trailing slash
      (function() {
        var p = window.location.pathname;
        if (p.indexOf('.') === -1 && !p.endsWith('/')) {
          window.location.replace(p + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
